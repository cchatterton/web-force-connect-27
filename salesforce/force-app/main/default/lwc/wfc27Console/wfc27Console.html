<template>
  <lightning-card title="Web Force Connect 27" icon-name="standard:connected_apps">
    <div class="slds-p-around_medium">
      <template if:true={error}><div class="slds-text-color_error slds-m-bottom_small" role="alert">{error}</div></template>
      <template if:true={status}>
        <section class="train-widget" aria-label="Salesforce sync train">
          <div class="train-widget-heading">
            <h2 class="slds-text-heading_medium">Sync Train Departing</h2>
            <lightning-button-icon icon-name={trainControlIcon} alternative-text={trainControlLabel} title={trainControlLabel} onclick={toggleTrain} variant="border-filled"></lightning-button-icon>
          </div>
          <div class="train-countdown" aria-live="off">{heartbeatCountdown}</div>
          <p class="train-state" aria-live="polite">{trainStateLabel}</p>
          <div class="heartbeat" role="progressbar" aria-label="Time until next train" aria-valuemin="0" aria-valuemax="100" aria-valuenow={heartbeatPercent}><div class="heartbeat-fill" style={heartbeatStyle}></div></div>
        </section>
        <template if:true={status.lastError}><p class="slds-text-color_error" role="alert">Last transport error: {status.lastError}</p></template>
        <lightning-input type="number" label="Items per train" min="1" max="100" value={status.batchSize} onchange={changeBatch}></lightning-input>
        <lightning-button label="Save train capacity" onclick={saveBatch} class="slds-m-top_small"></lightning-button>
        <h2 class="slds-text-heading_small slds-m-top_large">Recent train trips</h2>
        <div class="trip-filters">
          <lightning-combobox label="Show" value={tripPeriod} options={tripPeriods} onchange={changeTripPeriod}></lightning-combobox>
          <lightning-input type="date" label="Date (UTC)" value={tripDay} onchange={changeTripDay}></lightning-input>
          <lightning-combobox label="Hour (UTC)" value={tripHour} options={tripHours} onchange={changeTripHour}></lightning-combobox>
        </div>
        <lightning-datatable key-field="Id" data={trips} columns={tripColumns} hide-checkbox-column></lightning-datatable>
        <h2 class="slds-text-heading_small slds-m-top_large">Station</h2>
        <p>WFC27 stores raw payloads here. No record processing runs in this package.</p>
        <p>Packets waiting at Salesforce station: {status.waiting}</p>
        <p><a href="/lightning/o/WFC27_Station__c/list">Open Station Items</a></p>
        <lightning-datatable key-field="Id" data={status.station} columns={stationColumns} hide-checkbox-column></lightning-datatable>
        <lightning-textarea label="Stage outbound payload for a train test" value={json} onchange={changeJson}></lightning-textarea>
        <lightning-button label="Stage payload" onclick={stageJson} class="slds-m-top_small"></lightning-button>
      </template>
    </div>
  </lightning-card>
</template>
