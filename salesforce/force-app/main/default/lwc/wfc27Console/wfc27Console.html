<template>
  <lightning-card title="Web Force Connect 27" icon-name="standard:connected_apps">
    <div class="slds-p-around_medium">
      <template if:true={error}><div class="slds-text-color_error slds-m-bottom_small" role="alert">{error}</div></template>
      <lightning-tabset>
        <lightning-tab label="Transport" onactive={showTransport}>
          <template if:true={status}>
            <section class="train-widget" aria-label="Salesforce sync train">
              <div class="train-widget-heading">
                <h2 class="slds-text-heading_medium">Sync Train Departing</h2>
                <lightning-button-icon icon-name={trainControlIcon} alternative-text={trainControlLabel} title={trainControlLabel} onclick={toggleTrain} variant="border-filled"></lightning-button-icon>
              </div>
              <div class="train-countdown" aria-live="off">{heartbeatCountdown}</div>
              <p class="train-state" aria-live="polite">{trainStateLabel}</p>
              <div class="heartbeat" role="progressbar" aria-label="Time until next train" aria-valuemin="0" aria-valuemax="100" aria-valuenow={heartbeatPercent}>
                <div class="heartbeat-fill" style={heartbeatStyle}></div>
              </div>
            </section>
            <p>Waiting: {status.waiting} · Packet errors: {status.errors}</p>
            <template if:true={status.lastError}><p class="slds-text-color_error" role="alert">Last transport error: {status.lastError}</p></template>
            <p>Average content wait: {status.averageWaitSeconds} seconds (latest 100 completed)</p>
            <lightning-input type="number" label="Items per train" min="1" max="100" value={status.batchSize} onchange={changeBatch}></lightning-input>
            <lightning-button label="Save batch size" onclick={saveBatch} class="slds-m-top_small"></lightning-button>
            <lightning-input label="Trace a Salesforce record ID" value={searchId} onchange={changeSearch}></lightning-input>
            <lightning-button label="Show journey" onclick={showJourney}></lightning-button>
            <template if:true={journeyData}>
              <template if:true={journeyData.identity}><p>WordPress ID: {journeyData.identity.WP_Post_ID__c} · Status: {journeyData.identity.WP_Status__c}</p></template>
              <lightning-datatable key-field="Id" data={journeyData.queue} columns={journeyColumns} hide-checkbox-column></lightning-datatable>
            </template>
            <lightning-datatable key-field="Id" data={status.packets} columns={packetColumns} hide-checkbox-column class="slds-m-top_medium"></lightning-datatable>
          </template>
        </lightning-tab>
        <lightning-tab label="Object bindings" onactive={showObjects}>
          <p class="slds-m-bottom_small">Add objects now; each starts syncing only when it is active and has a WFC27_Eligible__c checkbox or checkbox formula. In Object Manager, enter Field Name WFC27_Eligible; Salesforce adds __c. The field decides which records qualify.</p>
          <lightning-datatable key-field="bindingId" data={configuredBindings} columns={objectColumns} onrowaction={editObjectRule} hide-checkbox-column></lightning-datatable>
          <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">{objectFormTitle}</h3>
          <lightning-input type="search" label="Find Salesforce object" value={objectSearch} oninput={changeObjectSearch}></lightning-input>
          <div class="binding-form-grid">
            <lightning-combobox label="Salesforce object" options={objectOptions} value={selectedObject} onchange={chooseObject}></lightning-combobox>
            <lightning-input label="WordPress post type" value={postType} onchange={changePostType}></lightning-input>
            <lightning-combobox label="Status when eligible" options={statusOptions} value={eligibleStatus} onchange={changeEligibleStatus}></lightning-combobox>
          </div>
          <template if:true={selectedRow}>
            <template if:false={selectedRow.hasFlag}><p class="slds-text-color_error slds-m-top_small">This object has no WFC27_Eligible__c checkbox yet. Use Field Name WFC27_Eligible in Object Manager; do not enter the __c suffix. You can save the binding, but it will not sync until the field exists.</p></template>
            <template if:true={nearEligibilityField}><p class="slds-text-color_error">Found {nearEligibilityField} on this object. Its API name differs from WFC27_Eligible__c.</p></template>
            <div class="binding-form-grid binding-form-grid-secondary">
              <lightning-input type="checkbox" label="Active — sync when eligible" checked={active} onchange={changeActive}></lightning-input>
              <lightning-input type="number" label="Draft retention days" min="0" value={draftDays} onchange={changeDraft}></lightning-input>
              <lightning-input type="number" label="Bin retention days" min="0" value={binDays} onchange={changeBin}></lightning-input>
            </div>
            <lightning-button label="Save object binding" variant="brand" onclick={saveObjectRule} disabled={saveDisabled}></lightning-button>
            <lightning-button label="Queue base sync" onclick={queueBaseSync} disabled={baseDisabled} class="slds-m-left_small"></lightning-button>
          </template>
        </lightning-tab>
        <lightning-tab label="Field bindings" onactive={showFields}>
          <template if:true={bindingId}>
            <p class="slds-m-bottom_small">Map a Salesforce field to a WordPress post field or meta key. Fields bound here are locked in WordPress.</p>
            <lightning-combobox label="Salesforce field" options={fieldOptions} value={sourceField} onchange={chooseField}></lightning-combobox>
            <lightning-combobox label="Target" options={targetOptions} value={targetType} onchange={chooseTarget}></lightning-combobox>
            <lightning-input label="WordPress key" value={wpKey} onchange={changeKey}></lightning-input>
            <lightning-button label="Add field binding" onclick={saveFieldRule} disabled={fieldSaveDisabled}></lightning-button>
            <lightning-datatable key-field="Id" data={fieldRules} columns={fieldColumns} hide-checkbox-column class="slds-m-top_medium"></lightning-datatable>
          </template>
          <template if:false={bindingId}><p>Select and save an object binding first.</p></template>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </lightning-card>
</template>
